name: E01 CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: E01 engineering
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: antu
          POSTGRES_PASSWORD: antu_ci_only
          POSTGRES_DB: antu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antu -d antu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://antu:antu_ci_only@127.0.0.1:5432/antu_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm and record versions
        run: |
          npm install --global npm@11.19.1
          node --version
          npm --version
          git rev-parse HEAD
          test -n "$DATABASE_URL"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify project layout and current documentation links
        run: npm run project:check
      - name: Install isolated original Python contract oracle
        run: |
          python3 -m venv "$RUNNER_TEMP/trip-state-oracle"
          "$RUNNER_TEMP/trip-state-oracle/bin/python" -m pip install -r scripts/requirements-oracle.txt
          echo "TRIP_STATE_PYTHON=$RUNNER_TEMP/trip-state-oracle/bin/python" >> "$GITHUB_ENV"
      - name: Verify dependency tree and specification handoff
        run: |
          npm ls --all
          npm run specs:verify
          npm run specs:ac8
          npm run contracts:check
          npm run dc:check
      - name: Verify proposed DC 0.1 calibration offline
        run: '"$TRIP_STATE_PYTHON" scripts/check-dc-calibration.py'
      - name: Verify separate DC-AC8 R6 source snapshot
        run: '"$TRIP_STATE_PYTHON" scripts/check-dc-ac8-r6.py'
      - name: Pinned accepted R6 and corresponding AC8 TS reference regression
        env:
          E03_01_REFERENCE_EVIDENCE_PATH: ${{ runner.temp }}/e03-01-reference.json
        run: '"$TRIP_STATE_PYTHON" scripts/e03-01-reference.py'
      - name: Preserve E03-01 pinned reference evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e03-01-reference
          path: ${{ runner.temp }}/e03-01-reference.json
          if-no-files-found: error
          retention-days: 14
      - name: Audit E03-00 baseline and original reference availability
        env:
          E03_00_EVIDENCE_PATH: ${{ runner.temp }}/e03-00-reference-audit.json
        run: '"$TRIP_STATE_PYTHON" scripts/audit-e03-00.py --run-reference'
      - name: Preserve E03-00 original reference audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e03-00-reference-audit
          path: ${{ runner.temp }}/e03-00-reference-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Empty database migration and least-privilege storage test identity
        run: |
          E02_TEST_PROVISION=1 MIGRATION_DATABASE_URL="$DATABASE_URL" node scripts/prepare-storage-tests.mjs "$RUNNER_TEMP/e02-storage.json"
          E02_TEST_PROVISION=1 MIGRATION_DATABASE_URL="$DATABASE_URL" node scripts/prepare-storage-tests.mjs "$RUNNER_TEMP/e03-04-write-storage.json"
          node --input-type=module -e 'import fs from "node:fs"; const p=process.env.RUNNER_TEMP+"/e02-storage.json", w=process.env.RUNNER_TEMP+"/e03-04-write-storage.json"; const e=JSON.parse(fs.readFileSync(p)); fs.appendFileSync(process.env.GITHUB_ENV,"E02_STORAGE_ENV_FILE="+p+"\nE03_PR29_WRITE_STORAGE_ENV_FILE="+w+"\nDATABASE_URL="+e.runtimeUrl+"\n");'
      - name: Rehearse E03 candidate SQL installer and rollback
        run: node scripts/e03-evidence-migration-rehearsal.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Vitest including real PostgreSQL integration
        env:
          E02_ENGINE_EVIDENCE_PATH: ${{ runner.temp }}/e02-03-typescript-scenario-a.json
          E02_CONFIRMATION_EVIDENCE_PATH: ${{ runner.temp }}/e02-04a-confirmation.jsonl
          E02_BCG_EVIDENCE_PATH: ${{ runner.temp }}/e02-04b-bcg.json
          E02_BCG_STORAGE_EVIDENCE_PATH: ${{ runner.temp }}/e02-04b-postgres.jsonl
          E02_FACT_EVIDENCE_PATH: ${{ runner.temp }}/e02-04c-external-facts.json
          E02_FACT_STORAGE_EVIDENCE_PATH: ${{ runner.temp }}/e02-04c-postgres.jsonl
          E02_DEF_EVIDENCE_PATH: ${{ runner.temp }}/e02-04d-def.json
          E02_FINAL_STORAGE_EVIDENCE_PATH: ${{ runner.temp }}/e02-04d-postgres.jsonl
          E03_C12_REFERENCE_EVIDENCE_PATH: ${{ runner.temp }}/e03-02-c12-comparison.json
        run: npm test
      - name: Preserve synthetic R6 and C12 candidate comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e03-02-c12-reference-comparison
          path: ${{ runner.temp }}/e03-02-c12-comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual TypeScript Scenario A execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e02-03-typescript-scenario-a
          path: ${{ runner.temp }}/e02-03-typescript-scenario-a.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual PostgreSQL confirmation lifecycle execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e02-04a-confirmation
          path: ${{ runner.temp }}/e02-04a-confirmation.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual BCG command and PostgreSQL execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e02-04b-bcg
          path: |
            ${{ runner.temp }}/e02-04b-bcg.json
            ${{ runner.temp }}/e02-04b-postgres.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual ExternalFact command and PostgreSQL execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e02-04c-external-facts
          path: |
            ${{ runner.temp }}/e02-04c-external-facts.json
            ${{ runner.temp }}/e02-04c-postgres.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual DEF, Issue and PostgreSQL execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e02-04d-final-commands
          path: |
            ${{ runner.temp }}/e02-04d-def.json
            ${{ runner.temp }}/e02-04d-postgres.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Original Python semantic and reservation regression
        working-directory: specs/baseline-2026-10-27/trip-state-schema-v0.1/90_可运行工程包
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: '"$TRIP_STATE_PYTHON" -m unittest tests.test_tripstate tests.test_global_consistency tests.test_reservation_profile'
      - name: Approved stage A package Python reference regression
        run: |
          cp -R specs/ts-ac8-stage-a-2026-11-03/trip-state-schema-v0.1 "$RUNNER_TEMP/ts-ac8"
          cd "$RUNNER_TEMP/ts-ac8/90_可运行工程包"
          "$TRIP_STATE_PYTHON" run_validation.py
      - name: Check database connectivity
        run: npm run db:check
      - name: Production build
        run: npm run build
      - name: Actual Next.js HTTP and PostgreSQL acceptance
        env:
          E02_HTTP_EVIDENCE_PATH: ${{ runner.temp }}/e02-05-http.json
        run: npm run test:http
      - name: Preserve actual authenticated HTTP execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e02-05-authenticated-http
          path: ${{ runner.temp }}/e02-05-http.json
          if-no-files-found: error
          retention-days: 14
