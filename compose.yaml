services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: antu
      POSTGRES_PASSWORD: antu_local_only
      POSTGRES_DB: antu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - antu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antu -d antu"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  antu_pgdata:
